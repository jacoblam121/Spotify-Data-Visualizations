<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Syntax Check</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: monospace; padding: 20px; }
    </style>
</head>
<body>
    <h1>Syntax Check</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        function log(msg) {
            console.log(msg);
            output.innerHTML += msg + '<br>';
        }

        log('1. Testing script loading individually...');
        
        // Check if scripts load without errors
        window.addEventListener('error', function(e) {
            log('❌ Script error: ' + e.message + ' in ' + e.filename + ':' + e.lineno);
        });
        
        // Test each step
        log('2. About to load genre_colors.js...');
    </script>
    
    <script src="../js/genre_colors.js"></script>
    
    <script>
        log('3. genre_colors.js loaded, testing functions...');
        try {
            const testGenre = getGenreColor('pop');
            log('✅ getGenreColor works: ' + testGenre);
        } catch (error) {
            log('❌ getGenreColor error: ' + error.message);
        }
        
        log('4. About to load base_renderer.js...');
    </script>
    
    <script src="../js/renderers/base_renderer.js"></script>
    
    <script>
        log('5. base_renderer.js loaded, testing BaseRenderer...');
        try {
            log('✅ BaseRenderer defined: ' + (typeof BaseRenderer !== 'undefined'));
        } catch (error) {
            log('❌ BaseRenderer error: ' + error.message);
        }
        
        log('6. About to load canvas_renderer.js...');
    </script>
    
    <script src="../js/renderers/canvas_renderer.js"></script>
    
    <script>
        log('7. canvas_renderer.js loaded, testing CanvasRenderer...');
        try {
            log('✅ CanvasRenderer defined: ' + (typeof CanvasRenderer !== 'undefined'));
            
            if (typeof CanvasRenderer !== 'undefined') {
                log('8. Testing CanvasRenderer instantiation...');
                const container = document.createElement('div');
                const renderer = new CanvasRenderer(container, { debug: true });
                log('✅ CanvasRenderer created successfully!');
            }
        } catch (error) {
            log('❌ CanvasRenderer error: ' + error.message);
            log('Stack: ' + error.stack);
        }
    </script>
</body>
</html>
